	<script>
		window.addEventListener("onEmbeddedMessagingReady", () => {
			console.log("onEmbeddedMessagingReady event received");
		});

		window.addEventListener("onEmbeddedMessagingInitSuccess", () => {
			console.log("Received 'onEmbeddedMessagingInitSuccess'");
		});

		window.addEventListener("onEmbeddedMessagingInitError", () => {
			console.log("Received 'onEmbeddedMessagingInitError'");
		});
	</script>

	<script type="text/javascript">
		function disableEmbeddingButtons(clickedButton) {
			document.querySelectorAll('.button-container button').forEach((btn) => {
				if (btn === clickedButton) return;
				btn.disabled = true;
				btn.title = 'Already initialized. Refresh the page to try another.';
			});
		}

		function loadBootstrap(src, onLoad) {
			const script = document.createElement('script');
			script.type = 'text/javascript';
			script.src = src;
			script.onload = onLoad;
			document.body.appendChild(script);
		}
	</script>

	<script type="text/javascript">
		function initEmbeddedMessaging() {
			try {
				embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

				embeddedservice_bootstrap.init(
					'00DSB00000TcgK5',
					'Web2',
					'https://orgfarm-47f8da4be3.demo.test1.my.pc-rnd.site.com/ESWWeb21767636998721',
					{
						scrt2URL: 'https://orgfarm-47f8da4be3.demo.test1.my.pc-rnd.salesforce-scrt.com'
					}
				);
			} catch (err) {
				console.error('Error loading Embedded Messaging: ', err);
			}
		};

		function initMIAW(clickedButton) {
			disableEmbeddingButtons(clickedButton);
			loadBootstrap(
				'https://orgfarm-47f8da4be3.demo.test1.my.pc-rnd.site.com/ESWWeb21767636998721/assets/js/bootstrap.min.js',
				initEmbeddedMessaging
			);
		}
	</script>

	<script type="text/javascript">
		function init(plannerType, scrt2Url, orgId, deploymentNameOverride, siteUrlOverride, clickedButton) {
			disableEmbeddingButtons(clickedButton);
			loadBootstrap(
				'https://orgfarm-47f8da4be3.demo.test1.my.pc-rnd.site.com/ESWCWCUnauthVoice11778613684092/assets/js/bootstrap.js', // Sachin CWC Unauth Voice 1
				function () {
					try {
						let deploymentName = deploymentNameOverride;
						if (!deploymentName) {
							if (plannerType === "Voice Planner") {
								deploymentName = "CWCUnauth1";
							} else if (plannerType === "Unified Planner") {
								deploymentName = "CWCUnauth2";
							} else if (plannerType === "SDB40 Unified Planner with Transcription") {
								deploymentName = "CWCUnauth1";
							}
						}

						const siteUrl = siteUrlOverride || 'https://orgfarm-f4ab7b50ec.my.site-com.pyhwa2b2rvg70z62l90xkzdad119.wa.crm.dev:6101/ESWCWC01777358499446'; // CWC_00 willowy magpie
						console.log("Initializing with:", plannerType, deploymentName, scrt2Url, siteUrl);

						embeddedservice_bootstrap.settings.language = 'en';
						embeddedservice_bootstrap.settings.devMode = true;

						embeddedservice_bootstrap.init(
							orgId,
							deploymentName,
							siteUrl,
							{
								scrt2URL: scrt2Url
							}
						);
					} catch (err) {
						console.error('Error loading Embedded Messaging: ', err);
					}
				}
			);
		}
	</script>
