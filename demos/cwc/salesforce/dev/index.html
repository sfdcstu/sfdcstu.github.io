<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Main container for the entire layout */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 40px 20px 20px;
            box-sizing: border-box;
        }

        /* Title */
        .title {
            font-size: 32px;
            font-weight: 600;
            color: #202123;
            margin: 0 0 40px 0;
            text-align: center;
        }

        /* Center the site content container */
        .site-content-container {
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            width: 100%;
            min-height: 0;
        }

        /* Style the centered cwc-shell */
        #cwc-shell {
            width: 48rem;
            height: 100%;
            background: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #cwc-shell iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            flex: 1;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <h1 class="title">Inline</h1>
        
        <div class="site-content-container">
            <div class="cwc-shell" id="cwc-shell">
            </div>
        </div>
    </div>
